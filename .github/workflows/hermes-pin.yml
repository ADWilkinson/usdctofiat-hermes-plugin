name: hermes pin

# Re-derives tests/hermes_pinned.py from the Hermes revision it names and fails
# if the committed file is not faithful -- a hand-edit, or a bumped SHA that was
# never regenerated. Then runs Hermes' real install-time security scanner over
# the tracked tree, because a `caution` verdict there refuses the one-line
# install the README documents and the offline guard only re-implements the
# scanner's structural half.
#
# Deliberately not a pull-request check. This is the only thing here that reads
# GitHub for source it does not own, and GitHub's anti-scraping protection
# answers those reads with 429 often enough that gating merges on it turns an
# unrelated throttle into a red required check. The revision is pinned by SHA,
# so the answer is a constant; checking it weekly is enough.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: snapshot and install scan match the pinned revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-derive and compare
        env:
          # Read-only, and only spent on contents reads of the pinned public
          # Hermes revision.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_hermes_pin.py --check

      # Runs even when the snapshot drifted: the verdict on the tree we ship is
      # worth knowing either way, and the two failures are independent.
      - name: Would the documented install still be allowed
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/hermes_install_scan.py
